<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>모바일 미리보기</title>
    <style>
      html, body { margin: 0; background: #000; }
      body { display: flex; justify-content: center; padding: 0; }
      iframe { width: 390px; height: 844px; border: 0; background: #101014; }
    </style>
  </head>
  <body>
    <iframe id="app" src="/" title="StockUp mobile preview"></iframe>
    <script>
      var q = new URLSearchParams(location.search).get('src');
      if (q) document.getElementById('app').src = q;
    </script>
  </body>
</html>
